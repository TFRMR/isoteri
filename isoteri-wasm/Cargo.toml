[package]
name = "isoteri-wasm"
version = "0.1.0"
edition = "2021"
description = "Wrapper wasm-bindgen tipis di atas compiler Isoteri asli (isoteri::ekspor_json_dari_sumber) -- supaya bisa kompilasi source Isoteri langsung di browser, tanpa CLI native. Lihat README.md di folder ini untuk cara build."

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# default-features = false: MATIKAN "jit" (Cranelift butuh backend codegen native,
# gak jalan di wasm32) & "native-http" (ureq butuh socket OS asli). Tanpa dua itu,
# isoteri jalan 100% bytecode-only -- SAMA PERSIS perilaku ISOTERI_NO_JIT=1 yang
# sudah diverifikasi lewat scripts/regresi.sh (lihat isoteri/Cargo.toml & catatan
# panjang di isoteri/src/lib.rs sekitar JitEngine). ekspor_json_dari_sumber()
# sendiri MEMANG SUDAH didesain tanpa JIT dari awal (dump bytecode fallback selalu
# ada apa pun status JIT-nya) -- gating fitur ini murni soal supaya cranelift-native
# tidak IKUT DICOBA dikompilasi untuk wasm32 sama sekali (yang pasti gagal).
isoteri = { path = "..", default-features = false }
wasm-bindgen = "=0.2.92"

[dev-dependencies]
# Cuma dipakai #[cfg(test)] -- validasi native (bukan wasm32) bahwa kompilasi()
# mengembalikan JSON yang benar-benar valid, sebelum sempat dites via wasm32.
serde_json = "1"

[profile.release]
opt-level = "s"   # optimasi ukuran -- bundle .wasm dikirim ke browser tiap load
lto = true
